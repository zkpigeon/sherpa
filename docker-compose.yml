# Sherpa on one machine: a home server or a VPS.
#   cp .env.example .env   # then fill in the three tokens
#   docker compose up -d --build
services:
  sherpa-server:
    build: { context: ., target: server }
    restart: unless-stopped
    environment:
      SHERPA_AGENT_TOKEN: ${SHERPA_AGENT_TOKEN:?set SHERPA_AGENT_TOKEN in .env}
      SHERPA_RUNNER_TOKEN: ${SHERPA_RUNNER_TOKEN:?set SHERPA_RUNNER_TOKEN in .env}
      SHERPA_ADMIN_TOKEN: ${SHERPA_ADMIN_TOKEN:?set SHERPA_ADMIN_TOKEN in .env}
      SHERPA_DEFAULT_MAX_MINUTES: ${SHERPA_DEFAULT_MAX_MINUTES:-90}
      SHERPA_MAX_MINUTES_CEILING: ${SHERPA_MAX_MINUTES_CEILING:-120}
      SHERPA_LEASE_MINUTES: ${SHERPA_LEASE_MINUTES:-2}
    ports:
      - ${SHERPA_BIND:-127.0.0.1}:${SHERPA_PORT:-8080}:8080
    # Only sherpa-server mounts the database, outside any folder an agent works in
    volumes:
      - sherpa-data:/data

  sherpa-runner:
    build: { context: ., target: runner }
    restart: unless-stopped
    depends_on:
      sherpa-server: { condition: service_healthy }
    # The runner gets its own token and nothing else
    environment:
      SHERPA_URL: http://sherpa-server:8080
      SHERPA_RUNNER_TOKEN: ${SHERPA_RUNNER_TOKEN:?set SHERPA_RUNNER_TOKEN in .env}
      SHERPA_RUNNER_NAME: ${SHERPA_RUNNER_NAME:-runner-1}
      SHERPA_LABELS: ${SHERPA_LABELS:-cpu}
      SHERPA_REPO: ${SHERPA_REPO:-}
      SHERPA_CPUSET: ${SHERPA_CPUSET:-}
      SHERPA_MEMORY: ${SHERPA_MEMORY:-}
      # With open, this runner stands down and scripts/open-runner.sh runs jobs on the host
      SHERPA_SANDBOX: ${SHERPA_SANDBOX:-strict}
    volumes:
      # To start job containers next to it. Job containers never get the socket
      - /var/run/docker.sock:/var/run/docker.sock
      - sherpa-work:/work
      # Bare repos on the host, for remotes like file:///repos/search.git
      - ${SHERPA_REPOS:-./repos}:/repos:ro

volumes:
  sherpa-data:
  sherpa-work:
